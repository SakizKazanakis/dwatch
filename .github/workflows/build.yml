name: Build Monolith APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Gadgetbridge branch or tag to build from
        default: master

env:
  UPSTREAM_URL: https://codeberg.org/Freeyourgadget/Gadgetbridge.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate HK8 BLE safety guardrails
        run: python3 -m unittest discover -s scripts -p "test_hk8_ble_*.py" -v

      - name: Fetch Gadgetbridge
        run: git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run HK8 pure-Java profile unit tests
        run: |
          mkdir -p /tmp/monolith-ble-unit
          javac -d /tmp/monolith-ble-unit \
            overlay/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/monolith/MonolithBleProfile.java \
            tests/MonolithBleProfileJvmTest.java \
            overlay/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/monolith/SifliWireCodec.java \
            tests/SifliWireCodecJvmTest.java
          java -cp /tmp/monolith-ble-unit nodomain.freeyourgadget.gadgetbridge.monolith.MonolithBleProfileJvmTest
          java -cp /tmp/monolith-ble-unit nodomain.freeyourgadget.gadgetbridge.monolith.SifliWireCodecJvmTest

      - name: Check offline ARM EABI5 hard-float prototype
        run: |
          bash watchface/prototypes/build_abi_probe.sh "${RUNNER_TEMP}/monolith_abi_probe.so"
          readelf -h "${RUNNER_TEMP}/monolith_abi_probe.so" | grep -q 'ARM'
          readelf -h "${RUNNER_TEMP}/monolith_abi_probe.so" | grep -q 'hard-float ABI'

      - name: Validate recovered OEM registration ABI (static only)
        run: python3 -m unittest discover -s scripts -p "test_hk8_registration_abi.py" -v

      - name: Compile offline Monolith registration hypothesis (never flash)
        run: bash watchface/prototypes/build_registration_hypothesis.sh "${RUNNER_TEMP}/monolith_registration_hypothesis.so"

      - name: Assert real public SiFli resource manager ARM32 structure layout
        run: bash watchface/abi/check_resource_abi.sh

      - name: Test LVGL event-0 container creation and ARM module offline
        run: bash watchface/prototypes/build_event0_offline.sh "${RUNNER_TEMP}/monolith_event0_offline.so"

      - name: Verify HK8 original LVGL resource descriptor parser
        run: python3 -m unittest discover -s scripts -p "test_hk8_lvgl_resource_inspector.py" -v

      - name: Check original Monolith eZIP resource and dimension conflict
        run: |
          python3 scripts/check_monolith_existing_dial.py overlay/app/src/main/assets/monolith/clock_bg.bin
          python3 -m unittest discover -s scripts -p "test_monolith_existing_dial.py" -v

      - name: Verify eZIP OEM display evidence and resource lifetime bounds
        run: python3 -m unittest discover -s scripts -p "test_hk8_ezip_display_audit.py" -v

      - name: Host-test OEM view and resource lifetime model (no hardware)
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            watchface/prototypes/monolith_oem_lifetime_mock.c \
            watchface/prototypes/test_oem_lifetime_mock.c \
            -o "${RUNNER_TEMP}/hk8_oem_lifetime_mock"
          "${RUNNER_TEMP}/hk8_oem_lifetime_mock"

      - name: Validate independent Monolith desktop renderer
        run: python3 -m unittest discover -s tests -p "test_monolith_offline_renderer.py" -v

      - name: Decode actual Monolith eZIP and compare deterministic RGB SHA
        run: |
          python3 watchface/ezip/monolith_decoder.py             overlay/app/src/main/assets/monolith/clock_bg.bin             --png "${RUNNER_TEMP}/monolith_decoded.png"             --raw "${RUNNER_TEMP}/monolith_decoded.rgb"
          python3 -m unittest discover -s tests -p 'test_monolith_ezip_decode.py' -v

      - name: ARM32 freestanding native renderer compile and symbol inspection
        run: |
          clang --target=armv7a-none-eabihf -march=armv7-a -mthumb -mfloat-abi=hard -mfpu=vfpv3-d16 -O2 \
            -DMONOLITH_FREESTANDING_ARM -ffreestanding -std=c11 \
            -Iwatchface/native_renderer/include \
            -c watchface/native_renderer/src/monolith_renderer.c \
            -o "${RUNNER_TEMP}/monolith_native_arm32.o"
          readelf -h "${RUNNER_TEMP}/monolith_native_arm32.o" | grep -q 'ELF32'
          readelf -sW "${RUNNER_TEMP}/monolith_native_arm32.o" | grep -q 'monolith_renderer_draw'

      - name: Native RGB renderer 1000 lifecycle tests
        run: |
          cmake -S watchface/native_renderer -B "${RUNNER_TEMP}/monolith-native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/monolith-native" --parallel
          ctest --test-dir "${RUNNER_TEMP}/monolith-native" --output-on-failure
          "${RUNNER_TEMP}/monolith-native/monolith_native_renderer_test"             "${RUNNER_TEMP}/monolith_decoded.rgb" "${RUNNER_TEMP}/monolith_frame.ppm"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Monolith branding and patches
        run: scripts/apply-branding.sh upstream

      # Same debug key on every run, so a new build installs over the previous one.
      - name: Use the shared debug key
        run: mkdir -p ~/.android && cp keystore/monolith-debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleMainlineDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug-apk
          path: upstream/app/build/outputs/apk/mainline/debug/*.apk

      # Pushes to main and manual runs refresh one fixed release, so the phone
      # always has the same direct download link.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp upstream/app/build/outputs/apk/mainline/debug/*.apk monolith.apk
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Monolith (последняя сборка)" --notes "Отладочная сборка Monolith. Скачай monolith.apk на телефон и установи."
          gh release upload latest monolith.apk -R "$GITHUB_REPOSITORY" --clobber

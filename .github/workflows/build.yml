name: Build Monolith APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Gadgetbridge branch or tag to build from
        default: master

env:
  UPSTREAM_URL: https://codeberg.org/Freeyourgadget/Gadgetbridge.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Gadgetbridge
        run: git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Monolith branding and patches
        run: scripts/apply-branding.sh upstream

      # Same debug key on every run, so a new build installs over the previous one.
      - name: Use the shared debug key
        run: mkdir -p ~/.android && cp keystore/monolith-debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleMainlineDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug-apk
          path: upstream/app/build/outputs/apk/mainline/debug/*.apk

      # Pushes to main and manual runs refresh one fixed release, so the phone
      # always has the same direct download link.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp upstream/app/build/outputs/apk/mainline/debug/*.apk monolith.apk
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Monolith (последняя сборка)" --notes "Отладочная сборка Monolith. Скачай monolith.apk на телефон и установи."
          gh release upload latest monolith.apk -R "$GITHUB_REPOSITORY" --clobber
